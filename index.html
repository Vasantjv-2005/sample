<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Secure Access</title>
    <link rel="stylesheet" href="style.css"
</head>
<body>
    <div class="login-container">
        <header class="login-header">
            <h1>Welcome Back</h1>
            <p>Please sign in to your account</p>
        </header>

        <main class="login-main">
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email"
                        required
                        autocomplete="email"
                    >
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div class="form-options">
                    <div class="remember-me">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="login-btn">Sign In</button>

                <div class="divider">
                    <span>or</span>
                </div>

                <div class="social-login">
                    <button type="button" class="social-btn google-btn">
                        <span class="social-icon">G</span>
                        Continue with Google
                    </button>
                    <button type="button" class="social-btn microsoft-btn">
                        <span class="social-icon">M</span>
                        Continue with Microsoft
                    </button>
                </div>
            </form>

            <div class="signup-link">
                <p>Don't have an account? <a href="#">Sign up</a></p>
            </div>
        </main>

        <footer class="login-footer">
            <p>&copy; 2024 Your Company. All rights reserved.</p>
            <nav class="footer-links">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Service</a>
                <a href="#">Contact Support</a>
            </nav>
        </footer>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Basic validation
            let isValid = true;
            
            // Reset error messages
            document.getElementById('emailError').textContent = '';
            document.getElementById('passwordError').textContent = '';
            
            // Email validation
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                document.getElementById('emailError').textContent = 'Please enter a valid email address';
                isValid = false;
            }
            
            // Password validation
            if (password.length < 6) {
                document.getElementById('passwordError').textContent = 'Password must be at least 6 characters';
                isValid = false;
            }
            
            if (isValid) {
                // Here you would typically send the login request to your server
                console.log('Login attempted with:', { email, remember: document.getElementById('remember').checked });
                alert('Login functionality would be implemented here');
            }
        });

        // Social login handlers
        document.querySelector('.google-btn').addEventListener('click', function() {
            console.log('Google login initiated');
            alert('Google OAuth would be implemented here');
        });

        document.querySelector('.microsoft-btn').addEventListener('click', function() {
            console.log('Microsoft login initiated');
            alert('Microsoft OAuth would be implemented here');
        });
    </script>
</body>
</html>
